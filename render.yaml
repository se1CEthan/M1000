        value: 6e6c1018-48f4-49fd-a10d-36d6cd70eefe
      - key: CRYPTOMUS_PAYMENT_API_KEY
        sync: false
      - key: CRYPTOMUS_PAYOUT_API_KEY
        sync: false
      - key: CRYPTOMUS_WEBHOOK_SECRET
        value: seltech_webhook_secret_2024
      - key: APP_URL
        value: https://seltech.online
